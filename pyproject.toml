[project]
name = "segipintar"
version = "0.1.0"
description = "Aplikasi web belajar segitiga berbasis Cognitive Load Theory"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["backend"]
testpaths = ["backend/tests"]

[tool.black]
line-length = 100

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["segitiga", "asisten", "api", "db", "app", "bantuan"]
